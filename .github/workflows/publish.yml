# 配布先のリポジトリ（oxgenet/tran-pub）に置くワークフロー。置き場所は .github/workflows/publish.yml。
# ソースのリポジトリのリリース用ワークフローが release/<タグ> ブランチに配布物を push すると動き、
# リリースを作ってから、そのブランチを消す。
name: Publish

on:
  push:
    branches: ["release/**"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or update the release
        run: |
          TAG="$(cat tag.txt)"
          VERSION="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" assets/* --title "tran $VERSION" --notes-file notes.md \
              --target "${{ github.event.repository.default_branch }}"
          fi

      - name: Delete the hand-over branch
        run: git push origin --delete "${GITHUB_REF_NAME}"
